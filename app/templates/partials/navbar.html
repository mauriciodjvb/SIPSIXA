{% set ep = request.endpoint %}
<header class="site-header">
    <div class="container">
        <a href="{{ url_for('main.index') }}" class="brand" aria-label="Ir al inicio">
            {% include "partials/logo.html" %}
            <span class="brand__text">
                <span class="brand__title">Museo Digital</span><br>
                <span class="brand__sub">Ing. de Sistemas · Unilibre</span>
            </span>
        </a>

        <nav class="nav" data-nav aria-label="Navegación principal">
            <a href="{{ url_for('main.index') }}" class="{{ 'is-active' if ep == 'main.index' }}">Inicio</a>
            <a href="{{ url_for('main.historia') }}" class="{{ 'is-active' if ep == 'main.historia' }}">Historia</a>
            <a href="{{ url_for('main.proyectos') }}" class="{{ 'is-active' if ep in ('main.proyectos', 'main.proyecto_detalle') }}">Proyectos</a>
            <a href="{{ url_for('main.investigacion') }}" class="{{ 'is-active' if ep == 'main.investigacion' }}">Investigación</a>
            <a href="{{ url_for('main.eventos') }}" class="{{ 'is-active' if ep in ('main.eventos', 'main.evento_detalle') }}">Eventos</a>
            <a href="{{ url_for('main.hall_fama') }}" class="{{ 'is-active' if ep in ('main.hall_fama', 'main.perfil') }}">Hall de la Fama</a>
        </nav>

        <div class="header-actions">
            <a href="{{ url_for('main.login') }}" class="btn btn--white" data-sesion="fuera">Ingresar</a>

            <div class="user-menu" data-sesion="dentro" hidden>
                <button type="button" class="user-menu__btn" data-menu-usuario aria-haspopup="true" aria-expanded="false">
                    <span class="avatar avatar--white" data-u-inicial>U</span>
                    <span class="user-menu__name" data-u-primer></span>
                    <span aria-hidden="true">▾</span>
                </button>
                <div class="user-menu__panel" data-menu-panel hidden>
                    <div class="user-menu__head">
                        <p class="user-menu__nombre" data-u-nombre></p>
                        <p class="user-menu__rol" data-u-rol></p>
                    </div>
                    <a href="{{ url_for('main.dashboard') }}">🏠 Mi Dashboard</a>
                    <a href="{{ url_for('main.registrar') }}">➕ Registrar contenido</a>
                    <a href="{{ url_for('main.validacion') }}" data-solo-admin>✅ Validar contenido</a>
                    <a href="{{ url_for('main.indicadores') }}" data-solo-admin>📊 Indicadores</a>
                    <button type="button" class="user-menu__salir" data-cerrar-sesion>↪ Cerrar sesión</button>
                </div>
            </div>

            <button class="nav-toggle" type="button" data-nav-toggle aria-label="Abrir menú" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>
