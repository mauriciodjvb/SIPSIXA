# Requiere un archivo .env (copia .env.example y cambia los valores).
services:
  app:
    build: .
    container_name: SIPSIXA_app

    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:?Falta .env}:${MYSQL_PASSWORD:?Falta .env}@db:3306/${MYSQL_DATABASE:?Falta .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Falta .env}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}

    # Modo desarrollo: el código se monta desde tu carpeta y gunicorn se recarga solo,
    # así ves tus cambios de HTML/CSS/JS sin reconstruir la imagen.
    command: gunicorn --bind 0.0.0.0:5000 --workers 3 --reload run:app
    volumes:
      - ./app:/app/app

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: SIPSIXA_db

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Falta .env}
      MYSQL_USER: ${MYSQL_USER:?Falta .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta .env}

    # Solo accesible desde tu propio computador (para DBeaver, Workbench, etc.)
    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
